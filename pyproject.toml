[project]
name = "paper-notion-flow"
version = "0.1.0"
description = "Sync Zotero papers to Notion and generate AI reading guides with a local Codex/Claude CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"

[project.urls]
Homepage = "https://github.com/LockFaiz/paper-notion-flow"
Repository = "https://github.com/LockFaiz/paper-notion-flow"
Issues = "https://github.com/LockFaiz/paper-notion-flow/issues"
dependencies = [
    "notion-client>=2.4.0",
    "openai>=2.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
]

[project.scripts]
paper-notion-flow = "paper_notion_flow.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
