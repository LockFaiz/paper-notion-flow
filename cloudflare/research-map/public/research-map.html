<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>研究地图 · Research Map</title>
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --card: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --code: #f1f5f9;
    /* 研究问题 = 紫 */
    --p: #7c3aed;
    --p-ink: #6d28d9;
    --p-soft: rgba(124, 58, 237, 0.10);
    --p-line: rgba(124, 58, 237, 0.22);
    /* 方法 = 青绿 */
    --m: #0d9488;
    --m-ink: #0f766e;
    --m-soft: rgba(13, 148, 136, 0.10);
    --m-line: rgba(13, 148, 136, 0.24);
    /* 空白/可做 = 琥珀 */
    --g: #d97706;
    --g-ink: #b45309;
    --g-soft: rgba(217, 119, 6, 0.12);
    --g-line: rgba(217, 119, 6, 0.30);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px -16px rgba(15, 23, 42, 0.25);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161619;
      --surface: #1f1f23;
      --card: #27272b;
      --border: #3f3f46;
      --border-strong: #52525b;
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --faint: #71717a;
      --code: #161619;
      --p: #a78bfa;
      --p-ink: #c4b5fd;
      --p-soft: rgba(167, 139, 250, 0.14);
      --p-line: rgba(167, 139, 250, 0.30);
      --m: #2dd4bf;
      --m-ink: #5eead4;
      --m-soft: rgba(45, 212, 191, 0.14);
      --m-line: rgba(45, 212, 191, 0.30);
      --g: #fbbf24;
      --g-ink: #fcd34d;
      --g-soft: rgba(251, 191, 36, 0.14);
      --g-line: rgba(251, 191, 36, 0.34);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }
  .brand .glyph {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, var(--p), var(--m));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px;
  }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .sub { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }

  .search {
    position: relative; flex: 1 1 240px; max-width: 340px; min-width: 180px;
  }
  .search input {
    width: 100%; box-sizing: border-box;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 12px 8px 32px; font-size: 13px; font-family: inherit;
  }
  .search input:focus { outline: none; border-color: var(--p); box-shadow: 0 0 0 3px var(--p-soft); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; font-weight: 600; cursor: pointer; user-select: none;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 5px 11px; transition: all .12s ease;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ---------- section heading ---------- */
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin: 34px 2px 14px; }
  .sec-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .sec-head .en { font-size: 11.5px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .sec-head .count { margin-left: auto; font-size: 12px; color: var(--muted); }

  /* ---------- metric cards ---------- */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
  .metric {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 16px 15px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .metric::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--muted)); }
  .metric .label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .metric .num { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 6px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .metric .meta { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
  .metric.m-paper { --accent: var(--p); }
  .metric.m-prob { --accent: var(--p); }
  .metric.m-method { --accent: var(--m); }
  .metric.m-gap { --accent: var(--g); }
  .metric.m-gap .num { color: var(--g-ink); }

  /* ---------- trend ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px 16px;
  }
  .trend-chart { display: flex; align-items: flex-end; gap: 3px; height: 130px; margin-top: 8px; }
  .tbar { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; cursor: default; }
  .tbar .fill {
    width: 100%; max-width: 26px; border-radius: 4px 4px 2px 2px;
    background: linear-gradient(180deg, var(--p), color-mix(in srgb, var(--p) 55%, transparent));
    transition: filter .12s ease; min-height: 2px;
  }
  .tbar:hover .fill { filter: brightness(1.12); }
  .tbar.empty .fill { background: var(--border); opacity: .5; }
  .trend-axis { display: flex; margin-top: 7px; border-top: 1px solid var(--border); padding-top: 6px; }
  .trend-axis .ylab { flex: 1 1 0; text-align: center; font-size: 10.5px; color: var(--faint); font-weight: 600; min-width: 0; }

  /* ---------- problem clusters ---------- */
  .clusters { display: flex; flex-direction: column; gap: 12px; }
  .cluster {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; border-left: 3px solid var(--p);
  }
  .cl-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 15px 18px; cursor: pointer; align-items: center; }
  .cl-head:hover { background: var(--p-soft); }
  .cl-title { display: flex; align-items: center; gap: 9px; }
  .cl-title .caret { color: var(--faint); transition: transform .18s ease; flex: none; }
  .cluster.open .cl-title .caret { transform: rotate(90deg); }
  .cl-title h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .cl-title .rank { font-size: 11px; font-weight: 700; color: var(--p); background: var(--p-soft); border-radius: 6px; padding: 2px 7px; flex: none; }
  .cl-desc { grid-column: 1; font-size: 12.5px; color: var(--muted); padding-left: 25px; }
  .cl-weight { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 130px; }
  .cl-weight .pcount { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cl-weight .pcount span { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .wbar { width: 130px; height: 7px; border-radius: 999px; background: var(--p-soft); overflow: hidden; }
  .wbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--p-ink), var(--p)); }

  .cl-body { padding: 0 18px 16px; display: grid; grid-template-columns: 1fr; gap: 14px; }
  .subhead { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .subhead .tag { width: 7px; height: 7px; border-radius: 50%; }

  .methods { display: flex; flex-wrap: wrap; gap: 7px; }
  .method {
    display: inline-flex; align-items: center; gap: 7px; cursor: default;
    background: var(--m-soft); border: 1px solid var(--m-line); color: var(--m-ink);
    border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .method .kind { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .7; white-space: nowrap; }
  .method .rel { font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--surface); border-radius: 5px; padding: 1px 5px; border: 1px solid var(--border); white-space: nowrap; }

  .gaps-inline { display: flex; flex-direction: column; gap: 6px; }
  .gap-row {
    display: flex; align-items: flex-start; gap: 9px; cursor: default;
    background: var(--g-soft); border: 1px solid var(--g-line); border-radius: 8px; padding: 8px 11px;
  }
  .gap-row .mk { color: var(--g); flex: none; margin-top: 1px; }
  .gap-row .gtxt { font-size: 12.5px; font-weight: 600; color: var(--g-ink); }
  .gap-row .grat { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }

  .papers { border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 2px; }
  .paper-li { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; font-size: 12.5px; }
  .paper-li .ttl { min-width: 0; }
  .paper-li .date { font-size: 11px; font-weight: 700; color: var(--p); font-variant-numeric: tabular-nums; background: var(--p-soft); border-radius: 5px; padding: 2px 7px; flex: none; min-width: 56px; text-align: center; }
  .paper-li .ttl { color: var(--text); }

  .collapsed-body { display: none; }
  .cluster.open .collapsed-body { display: grid; }

  /* ---------- opportunities ---------- */
  .opps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .opp {
    background: var(--surface); border: 1px solid var(--g-line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 15px 16px; border-left: 3px solid var(--g);
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opp .box {
    width: 20px; height: 20px; border-radius: 6px; flex: none; margin-top: 1px;
    border: 2px solid var(--g); display: grid; place-items: center; color: var(--g);
  }
  .opp h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 700; color: var(--g-ink); }
  .opp .rat { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .opp .rel { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .opp .rel .r {
    font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 8px;
    background: var(--code); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
  }
  .opp .pc { font-size: 11px; color: var(--faint); margin-top: 8px; font-weight: 600; }

  /* ---------- paper list ---------- */
  .pl-wrap { padding: 6px 8px; }
  .pl-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; flex-wrap: wrap; }
  .pl-toolbar .lab { font-size: 11.5px; color: var(--faint); font-weight: 600; margin-right: 2px; }
  .pl-sort { font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 7px; padding: 4px 10px; white-space: nowrap; }
  .pl-sort.active { background: var(--p); border-color: var(--p); color: #fff; }
  .pl-row { display: grid; grid-template-columns: 62px 1fr auto 18px; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 10px; cursor: pointer; transition: background .12s ease; }
  .pl-row + .pl-row { border-top: 1px solid var(--border); }
  .pl-row:hover { background: var(--p-soft); }
  .pl-date { font-size: 11px; font-weight: 700; color: var(--p); font-variant-numeric: tabular-nums; background: var(--p-soft); border-radius: 6px; padding: 3px 0; text-align: center; align-self: start; margin-top: 2px; }
  .pl-main { min-width: 0; }
  .pl-title { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pl-zh { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .pl-contrib { font-size: 11.5px; color: var(--faint); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .pl-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 230px; }
  .pl-chip { font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; border: 1px solid; }
  .pl-chip.pp { color: var(--p-ink); background: var(--p-soft); border-color: var(--p-line); }
  .pl-chip.pm { color: var(--m-ink); background: var(--m-soft); border-color: var(--m-line); }
  .pl-chip.pg { color: var(--g-ink); background: var(--g-soft); border-color: var(--g-line); }
  .pl-badge { font-size: 10px; font-weight: 800; letter-spacing: .02em; border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
  .pl-badge.pdf { color: #fff; background: var(--p); }
  .pl-badge.ai { color: var(--m-ink); background: var(--m-soft); border: 1px solid var(--m-line); }
  .pl-go { color: var(--faint); }
  .pl-row:hover .pl-go { color: var(--p); }

  /* contribution card → clickable */
  .scard[data-paper] { cursor: pointer; }
  .scard[data-paper]:hover { border-left-width: 4px; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 14px 30px -16px rgba(124,58,237,.5); }
  .paper-li[data-paper] { cursor: pointer; border-radius: 7px; padding-left: 6px; padding-right: 6px; margin: 0 -6px; transition: background .12s ease; }
  .paper-li[data-paper]:hover { background: var(--p-soft); }
  .paper-li .ttl-zh { font-size: 11px; color: var(--faint); }

  /* ---------- detail drawer ---------- */
  .drawer-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.46); opacity: 0; pointer-events: none; transition: opacity .25s ease; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 201; width: min(760px, 94vw); background: var(--bg); border-left: 1px solid var(--border); box-shadow: -20px 0 60px -30px rgba(0,0,0,.6); transform: translateX(102%); transition: transform .3s cubic-bezier(.4,0,.2,1); overflow-y: auto; overscroll-behavior: contain; }
  .drawer.open { transform: none; }
  .dw-head { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 16px 22px 14px; }
  .dw-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dw-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--p); }
  .dw-close { margin-left: auto; flex: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .dw-close:hover { color: var(--text); border-color: var(--border-strong); }
  .dw-title { font-size: 20px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; margin: 0; text-wrap: pretty; }
  .dw-zh { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .dw-byline { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px; font-size: 12px; color: var(--muted); }
  .dw-byline .by { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dw-byline .by b { color: var(--text); font-weight: 600; }
  .dw-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .dw-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; border-radius: 9px; padding: 8px 13px; cursor: pointer; text-decoration: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); white-space: nowrap; }
  .dw-btn:hover { border-color: var(--border-strong); }
  .dw-btn.primary { background: var(--p); border-color: var(--p); color: #fff; }
  .dw-btn.primary:hover { filter: brightness(1.06); }
  .dw-btn.notion { background: var(--m-soft); border-color: var(--m-line); color: var(--m-ink); }
  .dw-btn svg { flex: none; }

  .dw-body { padding: 6px 22px 60px; }
  .dw-sec { margin-top: 22px; }
  .dw-sec > .h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 11px; }
  .dw-sec > .h .ln { flex: 1; height: 1px; background: var(--border); }
  .dw-contrib { font-size: 14.5px; font-weight: 600; line-height: 1.6; color: var(--text); background: var(--p-soft); border: 1px solid var(--p-line); border-radius: 12px; padding: 14px 16px; text-wrap: pretty; }
  .dw-abstract { font-size: 13px; line-height: 1.7; color: var(--muted); text-wrap: pretty; }

  .nodes-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .nodes-col .nl { font-size: 11px; font-weight: 700; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .nodes-col .nl i { width: 7px; height: 7px; border-radius: 50%; }
  .node-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .node-chip { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 6px 10px; cursor: pointer; border: 1px solid; transition: filter .12s ease; white-space: nowrap; }
  .node-chip:hover { filter: brightness(.97); text-decoration: none; }
  .node-chip.np { color: var(--p-ink); background: var(--p-soft); border-color: var(--p-line); }
  .node-chip.nm { color: var(--m-ink); background: var(--m-soft); border-color: var(--m-line); }
  .node-chip.nm .k { font-size: 9.5px; font-weight: 800; opacity: .65; text-transform: uppercase; margin-right: 4px; }
  .node-chip.ng { color: var(--g-ink); background: var(--g-soft); border-color: var(--g-line); }

  .an-sec { margin-bottom: 14px; }
  .an-sec h5 { margin: 0 0 5px; font-size: 13px; font-weight: 700; color: var(--text); }
  .an-sec p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); text-wrap: pretty; }
  .an-ul { margin: 4px 0 0; padding-left: 18px; }
  .an-ul li { font-size: 13px; line-height: 1.65; color: var(--muted); margin-bottom: 3px; }
  .an-card { background: var(--m-soft); border: 1px solid var(--m-line); border-radius: 12px; padding: 15px 16px; }

  .pdf-frame { width: 100%; height: 64vh; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .pdf-stub { display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px; }
  .pdf-stub .ic { width: 38px; height: 38px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--p-soft); color: var(--p); }
  .pdf-stub .tx { font-size: 12.5px; color: var(--muted); }
  .pdf-stub .tx b { display: block; color: var(--text); font-size: 13px; font-weight: 700; margin-bottom: 1px; }

  .rel-list { display: flex; flex-direction: column; gap: 2px; }
  .rel-item { display: flex; align-items: baseline; gap: 10px; padding: 8px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .rel-item:hover { background: var(--p-soft); }
  .rel-item .rd { flex: none; min-width: 52px; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--p); background: var(--p-soft); border-radius: 5px; padding: 2px 6px; font-variant-numeric: tabular-nums; }
  .rel-item .rt { color: var(--text); min-width: 0; }
  .lineage { display: flex; flex-direction: column; gap: 7px; }
  .lin-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
  .lin-row .src { font-weight: 700; color: var(--m-ink); }
  .lin-row .rtype { font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--code); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; }
  .lin-row .tgt { color: var(--text); }

(function () {
  "use strict";
  var KIND_LABEL = { method: "方法", model: "模型", dataset: "数据集", metric: "指标", concept: "概念" };

  var app = document.getElementById("app");

  // -------- 读取并校验数据 --------

  var data = {
    problems: arr(G && G.problems),
    concepts: arr(G && G.concepts),
    relations: arr(G && G.relations),
    gaps: arr(G && G.gaps),

  };

  var hasData = data.problems.length || data.concepts.length || data.gaps.length;
  if (!hasData) { renderEmpty(); return; }

  // -------- 派生索引 --------
  var conceptByName = {};
  data.concepts.forEach(function (c) { if (c && c.name) conceptByName[c.name] = c; });

  // 每个问题：解决它的方法（relation.type=addresses, target=问题）
  var methodsForProblem = {};
  data.problems.forEach(function (p) { methodsForProblem[p.name] = []; });
  data.relations.forEach(function (r) {
    if (!r || r.type !== "addresses") return;

  });

  // 方法 -> 它解决的问题集合（用于把 gap 通过方法挂到问题）
  var problemsForMethod = {};
  data.relations.forEach(function (r) {

    (problemsForMethod[r.source] = problemsForMethod[r.source] || []).push(r.target);
  });

  // 每个问题相关的 gap：related 含问题名，或 related 含某个解决该问题的方法
  var gapsForProblem = {};

  data.gaps.forEach(function (gap) {
    var related = arr(gap.related);
    var hit = {};
    related.forEach(function (rel) {
      if (gapsForProblem[rel] !== undefined) hit[rel] = true; // related 直接是问题
      (problemsForMethod[rel] || []).forEach(function (pr) { hit[pr] = true; }); // related 是方法

  });

  // 统计
  function papersOf(p) { return arr(p.papers); }
  var allPapers = {};

  data.concepts.forEach(function (c) { arr(c.papers).forEach(function (t) { allPapers[t] = true; }); });

  var sortedProblems = data.problems.slice().sort(function (a, b) { return papersOf(b).length - papersOf(a).length; });

  // 论文 -> 概念/问题（贡献来源）；月份 -> 论文；按时间排序的论文

  // 该论文引入的概念参与的非 addresses 关系（学术脉络）
  function lineageForPaper(t) {
    var cs = (conceptsForPaper[t] || []).map(function (c) { return c.name; });

  function metricsHTML() {

  }

  function trendHTML() {
    if (!datedPapers.length) return "";
    var counts = {};
    Object.keys(papersByMonth).forEach(function (m) { counts[m] = papersByMonth[m].length; });
    var sorted = Object.keys(counts).sort();
    var first = sorted[0], last = sorted[sorted.length - 1];
    var series = buildMonthSeries(first, last);
    var maxC = series.reduce(function (m, s) { return Math.max(m, counts[s.key] || 0); }, 1);

  function oppsHTML() {
    if (!data.gaps.length) return "";
    var head = '<div class="sec-head"><h2>可做方向 · 研究机会</h2><span class="en">Opportunities</span>' +
      '<span class="count">' + data.gaps.length + " 个研究闭环上的断点</span></div>";

    var arrow = '<div class="clink"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h15"/><path d="m12 2 5 5-5 5"/></svg></div>';
    var broken = '<div class="clink broken" ' + 'data-tk="研究闭环的断点" data-tb="已有方法尚未延伸到此，闭环在这里中断——正是可做的机会。">' +
      '<svg width="26" height="16" viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8h7"/><path d="M18 8h7"/><path d="m13 1-3 6 4 1-3 7"/></svg></div>';

    var body = data.gaps.map(function (g) {
      var related = arr(g.related);
      var relMethods = related.filter(function (r) { return conceptByName[r]; });
      var probSet = {};
      related.forEach(function (r) { if (gapsForProblem[r] !== undefined) probSet[r] = true; });
      relMethods.forEach(function (m) { (problemsForMethod[m] || []).forEach(function (p) { probSet[p] = true; }); });

      var probNode = probs.length

      var doneLabel = relMethods.length ? relMethods.slice(0, 2).map(esc).join(" · ") + (relMethods.length > 2 ? " 等" : "") : "已有相关工作";
      var doneNode = '<div class="cnode done"><div class="cl">已有方法 ✓</div><div class="cn">' + doneLabel + "</div></div>";
      var gapNode = '<div class="cnode gapn"><div class="cl">待补空白</div><div class="cn">' + esc(g.name) + "</div></div>";
      var chain = '<div class="chain">' + probNode + arrow + doneNode + broken + gapNode + "</div>";

      // 已有工作：解释「其他论文做了啥」
      var workRows = "";
      var seen = {};
      relMethods.forEach(function (mName) {
        var c = conceptByName[mName];

        var dt = ps.map(function (t) { return data.dates[t]; }).filter(Boolean).sort()[0] || "—";

        ps.forEach(function (t) { seen[t] = true; });
      });
      arr(g.papers).forEach(function (t) {
        if (seen[t]) return; seen[t] = true;
        var cs = conceptsForPaper[t] || [];
        var desc = cs.length ? (cs[0].description || "") : ((problemsForPaper[t] || [])[0] ? "涉及「" + (problemsForPaper[t] || [])[0] + "」" : "相关研究");
        workRows += '<div class="wrow"><span class="wdate">' + esc(data.dates[t] || "—") + '</span>' +
          '<span class="wt">' + esc(t.length > 16 ? t.slice(0, 15) + "…" : t) + '</span>' +
          '<span class="wd">' + esc(desc) + "</span></div>";
      });

      var pc = arr(g.papers).length;
      var blob = esc((g.name + " " + (g.rationale || "") + " " + related.join(" ")).toLowerCase());
      return '<div class="oploop" data-search="' + blob + '">' +

        '<div><h4>' + esc(g.name) + '</h4><div class="osub">研究闭环断点 · 待补空白</div></div>' +
        '<span class="ocount">' + (relMethods.length + pc) + " 项已有工作</span></div>" +
        chain +

    return head + '<div class="opps2" id="opps">' + body + '<div class="no-match is-hidden" id="noMatchOpp">没有匹配的研究机会</div></div>';

  // ===================== 论文清单 + 详情 =====================

  function svgIcon(p, w) { return '<svg width="' + (w || 15) + '" height="' + (w || 15) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }

  function openPaper(t) {
    var m = metaOf(t); var dt = data.dates[t] || m.date || "—";
    var probs = problemsForPaper[t] || []; var cons = conceptsForPaper[t] || []; var gps = gapsForPaper[t] || [];
    var lead = cons[0];

    var byParts = [];
    if (m.authors && m.authors.length) byParts.push('<span class="by"><b>' + esc(m.authors.slice(0, 4).join("、")) + (m.authors.length > 4 ? " 等" : "") + '</b></span>');
    if (m.venue) byParts.push('<span class="by">' + esc(m.venue) + '</span>');
    byParts.push('<span class="by">' + esc(dt) + '</span>');

    var pdf = m.pdf || m.pdf_url || "";
    var actions = "";
    if (pdf) {
      var lab = /^zotero:/i.test(pdf) ? "在 Zotero 中打开 PDF" : (/^file:/i.test(pdf) ? "用本地阅读器打开" : "打开 PDF");
      actions += '<a class="dw-btn primary" href="' + esc(pdf) + '"' + (pdfEmbeddable(pdf) ? ' target="_blank" rel="noopener"' : "") + '>' + pdfIcon() + lab + '</a>';
    }
    if (m.notion_url) actions += '<a class="dw-btn notion" href="' + esc(m.notion_url) + '" target="_blank" rel="noopener">' + notionIcon() + '在 Notion 中打开</a>';
    if (m.bibtex) actions += '<button class="dw-btn" data-copy="' + esc(m.bibtex) + '">' + copyIcon() + '复制引用</button>';

    var nodeBlocks = "";
    if (probs.length) nodeBlocks += nodeCol("研究问题", "var(--p)", probs.map(function (pn) {
      return '<span class="node-chip np" data-goto="problem" data-val="' + esc(pn) + '">' + esc(pn) + '</span>'; }).join(""));
    if (cons.length) nodeBlocks += nodeCol("方法 / 概念", "var(--m)", cons.map(function (c) {
      return '<span class="node-chip nm" data-goto="concept" data-val="' + esc(c.name) + '"><span class="k">' + esc(KIND_LABEL[c.kind] || c.kind) + '</span>' + esc(c.name) + '</span>'; }).join(""));
    if (gps.length) nodeBlocks += nodeCol("关联空白 / 可做方向", "var(--g)", gps.map(function (g) {
      return '<span class="node-chip ng" data-goto="gap" data-val="' + esc(g.name) + '">' + esc(g.name) + '</span>'; }).join(""));

    var contrib = m.contribution || (lead ? ("引入「" + lead.name + "」" + (lead.description ? "：" + lead.description : "")) : "");

    var aiHtml;
    if (m.analysis && m.analysis.length) {
      aiHtml = '<div class="an-card">' + m.analysis.map(function (s) {
        var body;
        if (Array.isArray(s.b)) body = '<ul class="an-ul">' + s.b.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
        else body = '<p>' + esc(s.b).replace(/\n/g, "<br>") + '</p>';
        return '<div class="an-sec"><h5>' + esc(s.h) + '</h5>' + body + '</div>';
      }).join("") + '</div>';
    } else if (m.notion_url) {
      aiHtml = '<div class="dw-empty">解读保存在 Notion，点击上方「在 Notion 中打开」查看完整内容。</div>';
    } else {
      aiHtml = '<div class="dw-empty">暂无 AI 解读（同步 Notion 解析后将在此直接显示，无需打开 Notion）。</div>';
    }

    var pdfHtml;
    if (pdf && pdfEmbeddable(pdf)) {
      pdfHtml = '<iframe class="pdf-frame" src="' + esc(pdf) + '" title="PDF 预览"></iframe>';
    } else if (pdf) {
      pdfHtml = '<div class="pdf-stub"><div class="ic">' + pdfIcon() + '</div><div class="tx"><b>' + (/^zotero:/i.test(pdf) ? "在 Zotero 阅读器中打开" : "用本地 PDF 阅读器打开") + '</b>该条目的 PDF 已存在 Zotero 库中，点击上方按钮即可打开。</div></div>';
    } else {
      pdfHtml = '<div class="dw-empty">未关联 PDF（在 Zotero 中为该条目附加 PDF 后即可在此打开）。</div>';
    }

    var lin = lineageForPaper(t);
    var linHtml = lin.length ? '<div class="lineage">' + lin.map(function (r) {
      return '<div class="lin-row"><span class="src">' + esc(r.source) + '</span><span class="rtype">' + esc(REL_LABEL[r.type] || r.type) + '</span><span class="tgt">' + esc(r.target) + '</span></div>';
    }).join("") + '</div>' : "";

    var rel = relatedPapers(t);
    var relHtml = rel.length ? '<div class="rel-list">' + rel.map(function (o) {
      return '<div class="rel-item" data-paper="' + esc(o) + '"><span class="rd">' + esc(data.dates[o] || "—") + '</span><span class="rt">' + esc(truncate(dispTitle(o), 72)) + '</span></div>';
    }).join("") + '</div>' : "";

    var html =
      '<div class="dw-head"><div class="dw-top"><span class="dw-kicker">论文详情</span>' +
        '<button class="dw-close" data-close aria-label="关闭">' + xIcon() + '</button></div>' +
        '<h2 class="dw-title">' + esc(dispTitle(t)) + '</h2>' +
        (zhLabel(t) ? '<div class="dw-zh">' + esc(t) + '</div>' : "") +
        '<div class="dw-byline">' + byParts.join("") + '</div>' +
        (actions ? '<div class="dw-actions">' + actions + '</div>' : "") +
      '</div>' +
      '<div class="dw-body">' +
        (contrib ? sec("核心贡献", '<div class="dw-contrib">' + esc(contrib) + '</div>') : "") +
        (nodeBlocks ? sec("它在研究地图中的位置", '<div class="nodes-grid">' + nodeBlocks + '</div>') : "") +
        sec("AI 解读 · Notion", aiHtml) +
        (m.abstract ? sec("摘要", '<div class="dw-abstract">' + esc(m.abstract) + '</div>') : "") +
        sec("PDF 全文", pdfHtml) +
        (linHtml ? sec("学术脉络", linHtml) : "") +
        (relHtml ? sec("相关论文", relHtml) : "") +
      '</div>';

    var d = document.getElementById("drawer");
    d.innerHTML = html; d.scrollTop = 0;
    document.getElementById("drawerBg").classList.add("open");
    d.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePaper() {
    var d = document.getElementById("drawer"); if (!d) return;
    d.classList.remove("open");
    var bg = document.getElementById("drawerBg"); if (bg) bg.classList.remove("open");
    document.body.style.overflow = "";
  }

  function doGoto(type, val) {
    closePaper();
    setTimeout(function () {
      if (type === "problem") {
        var cl = null;
        document.querySelectorAll("#clusters .cluster").forEach(function (c) { var h = c.querySelector("h3"); if (h && h.textContent === val) cl = c; });
        if (cl) { cl.classList.add("open"); scrollToEl(cl); }
      } else if (type === "concept") {
        var q = document.getElementById("q"); q.value = val; applyFilters(); scrollToEl(document.getElementById("clusters"));
      } else if (type === "gap") {
        scrollToEl(document.getElementById("opps"));
      }
    }, 280);
  }
  function scrollToEl(el) { if (!el) return; var y = el.getBoundingClientRect().top + window.pageYOffset - 76; window.scrollTo({ top: y, behavior: "smooth" }); }
  function copyText(s) { try { navigator.clipboard.writeText(s); } catch (e) {} }

  // ===================== 交互 =====================
  function renderFilters() {
    var kinds = {};
    data.concepts.forEach(function (c) { if (c.kind) kinds[c.kind] = true; });
    var order = ["method", "model", "dataset", "metric", "concept"];
    var present = order.filter(function (k) { return kinds[k]; });
    var html = '<span class="chip active" data-kind="all">全部</span>' +
      present.map(function (k) {
        return '<span class="chip" data-kind="' + k + '"><span class="dot" style="background:var(--m)"></span>' + (KIND_LABEL[k] || k) + "</span>";
      }).join("");
    document.getElementById("filters").innerHTML = html;
  }

  function wireInteractions() {
    // 展开/收起
    document.querySelectorAll(".cl-head").forEach(function (h) {
      h.addEventListener("click", function () { h.parentElement.classList.toggle("open"); });
    });

    // tooltip
    document.addEventListener("mouseover", function (e) {
      var el = e.target.closest("[data-tk]");
      if (!el) return;
      var tk = el.getAttribute("data-tk"), tb = el.getAttribute("data-tb");
      tip.innerHTML = (tk ? '<span class="tk">' + esc(tk) + "</span>" : "") + esc(tb || "");
      tip.style.opacity = "1";
      moveTip(e);
    });
    document.addEventListener("mousemove", function (e) { if (tip.style.opacity === "1") moveTip(e); });
    document.addEventListener("mouseout", function (e) {
      if (e.target.closest("[data-tk]")) tip.style.opacity = "0";
    });

    // 搜索
    var q = document.getElementById("q");
    q.addEventListener("input", function () { applyFilters(); });

    // 类型筛选
    document.getElementById("filters").addEventListener("click", function (e) {
      var chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll("#filters .chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      applyFilters();
    });

    countUp();
    revealStream();
    revealBars();

    // 论文详情：点击任何带 data-paper 的元素（抽屉外）
    document.addEventListener("click", function (e) {
      if (e.target.closest(".drawer")) return;
      var el = e.target.closest("[data-paper]");
      if (el) openPaper(el.getAttribute("data-paper"));
    });
    // 论文清单排序
    var pl = document.getElementById("paperList");
    if (pl) pl.addEventListener("click", function (e) {
      var s = e.target.closest(".pl-sort"); if (!s) return;
      pl.querySelectorAll(".pl-sort").forEach(function (x) { x.classList.remove("active"); });
      s.classList.add("active"); sortList(s.getAttribute("data-sort"));
    });
    // 抽屉：关闭 / 内部导航 / 相关论文 / 复制
    var bg = document.getElementById("drawerBg"); if (bg) bg.addEventListener("click", closePaper);
    var dw = document.getElementById("drawer");
    if (dw) dw.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) { closePaper(); return; }
      var rp = e.target.closest("[data-paper]"); if (rp) { openPaper(rp.getAttribute("data-paper")); return; }
      var nav = e.target.closest("[data-goto]"); if (nav) { doGoto(nav.getAttribute("data-goto"), nav.getAttribute("data-val")); return; }
      var cp = e.target.closest("[data-copy]"); if (cp) { copyText(cp.getAttribute("data-copy")); cp.innerHTML = copyIcon() + "已复制"; }
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePaper(); });
  }

  // 柱状图：进入视口时生长
  function revealBars() {
    var bars = document.querySelector(".trend-bars");
    if (!bars) return;
    function go() { bars.classList.add("in"); }
    if (!("IntersectionObserver" in window)) { go(); } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { go(); io.disconnect(); } });
      }, { threshold: 0.1 });
      io.observe(bars);
      setTimeout(function () { if (!bars.classList.contains("in")) go(); }, 1200);
    }
    // 安全网：动画窗口后强制最终可见状态（防止个别环境 transition 不生效）
    setTimeout(function () {
      bars.querySelectorAll(".tcol:not(.empty) .fill").forEach(function (f) { f.style.transition = "none"; f.style.transform = "scaleY(1)"; });
    }, 1700);
  }

  // 指标数字滚动
  function countUp() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll(".metric .num").forEach(function (el) {
      var target = +el.getAttribute("data-val") || 0;
      if (reduce || target === 0) { el.textContent = target; return; }
      var dur = 900, t0 = null;
      function tick(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  // 贡献流：滚动进入视口时级联浮现
  function revealStream() {
    var stream = document.getElementById("stream");
    if (!stream) return;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function safety() {
      setTimeout(function () {
        stream.querySelectorAll(".scard").forEach(function (c) { c.style.transition = "none"; c.style.opacity = "1"; c.style.transform = "none"; });
      }, 2400);
    }
    if (reduce || !("IntersectionObserver" in window)) { stream.classList.add("in"); safety(); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { stream.classList.add("in"); io.disconnect(); } });
    }, { threshold: 0.12 });
    io.observe(stream);
    safety();
  }

  function moveTip(e) {
    var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

  function applyFilters() {
    var term = document.getElementById("q").value.trim().toLowerCase();
    var activeKind = (document.querySelector("#filters .chip.active") || {}).getAttribute
      ? document.querySelector("#filters .chip.active").getAttribute("data-kind") : "all";

    // 方法 kind 高亮/淡化
    document.querySelectorAll(".search-method").forEach(function (m) {
      var ok = activeKind === "all" || m.getAttribute("data-kind") === activeKind;
      m.style.opacity = ok ? "1" : "0.28";
    });

    // 问题聚类按关键词
    var visC = 0;
    document.querySelectorAll("#clusters .cluster").forEach(function (c) {
      var blob = c.getAttribute("data-search") || "";
      var kindOk = activeKind === "all" || hasKindMethod(c, activeKind);
      var ok = (!term || blob.indexOf(term) !== -1) && kindOk;
      c.classList.toggle("is-hidden", !ok);
      if (ok) visC++;
    });
    document.getElementById("noMatch").classList.toggle("is-hidden", visC !== 0);

    // 研究机会按关键词
    var oppsEl = document.getElementById("opps");
    if (oppsEl) {
      var visO = 0;
      oppsEl.querySelectorAll(".oploop").forEach(function (o) {
        var blob = o.getAttribute("data-search") || "";
        var ok = !term || blob.indexOf(term) !== -1;
        o.classList.toggle("is-hidden", !ok);
        if (ok) visO++;
      });
      document.getElementById("noMatchOpp").classList.toggle("is-hidden", visO !== 0);
    }

    // 论文清单按关键词
    var plRowsEl = document.getElementById("plRows");
    if (plRowsEl) {
      var visL = 0;
      plRowsEl.querySelectorAll(".pl-row").forEach(function (r) {
        var blob = r.getAttribute("data-search") || "";
        var ok = !term || blob.indexOf(term) !== -1;
        r.classList.toggle("is-hidden", !ok);
        if (ok) visL++;
      });
      var nml = document.getElementById("noMatchList");
      if (nml) nml.classList.toggle("is-hidden", visL !== 0);
    }
  }

  function hasKindMethod(cluster, kind) {
    var ms = cluster.querySelectorAll(".search-method");
    for (var i = 0; i < ms.length; i++) { if (ms[i].getAttribute("data-kind") === kind) return true; }
    return false;
  }

  function renderEmpty() {
    document.getElementById("filters").innerHTML = "";
    app.innerHTML = '<div class="empty"><div class="big">暂无研究数据</div>' +
      "<div>把论文同步到数据库并运行 AI 抽取后，研究地图会在这里展示<br>研究问题、方法、关系与可做方向的全景。</div></div>";
  }
})();
</script>
</body>
